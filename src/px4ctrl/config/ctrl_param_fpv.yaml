#########################################################################
# UADL-QAV250 controller configuration (Sections IV-B, V and VI-C).     #
# Units: SI. Axes: x, y horizontal; z vertical (ENU inertial frame).    #
#########################################################################

mass        : 0.9    # kg, QAV250 nominal mass m0
gra         : 9.81   # m/s^2
ctrl_freq_max   : 100.0  # Hz, control and sampling rate
max_manual_vel: 2.0  # m/s, RC stick velocity in AUTO_HOVER
max_angle: 80        # deg, attitude limit of the thrust/attitude mapping
low_voltage: 14.0    # V, 4S battery; lowest voltage of the thrust model

rc_reverse:
    roll: false
    pitch: true
    yaw: false
    throttle: true

auto_takeoff_land:
    enable: true
    enable_auto_arm: true
    no_RC: false
    takeoff_height: 0.5      # m
    takeoff_land_speed: 0.2  # m/s

thrust_model:
    # F = K1 * V^K2 * (K3*u^2 + (1-K3)*u) with accurate_thrust_model: true;
    # otherwise hover_percentage maps gravity to the normalized thrust.
    accurate_thrust_model: false
    K1: 2.10
    K2: 1.0
    K3: 0.0
    hover_percentage: 0.5

msg_timeout:   # s
    odom: 0.5
    rc:   0.5
    cmd:  0.5
    imu:  0.5
    bat:  0.5

controller:
  # Offline GAN prior + online task-error GP + uncertainty-aware tube MPC.
  solver_cutoff: 0.0085      # s from the scheduled cycle release, shared by the three axes
  deadline: 0.010            # s; late commands are discarded

prior:
  # TorchScript priors exported by utils/offline_GANs_Train.py, mapping
  # float32[N,6] = [px,py,pz,vx,vy,vz] to (f0[N,1], g0[N,1]) of Eq. (15).
  # run_ctrl.launch sets these paths to $(find px4ctrl)/models/generator_prior_{X,Y,Z}.pt.
  model_x: "generator_prior_X.pt"
  model_y: "generator_prior_Y.pt"
  model_z: "generator_prior_Z.pt"

online_gp:
  # Hyperparameters are selected offline and fixed during flight.
  l: 0.5                     # SE lengthscale on the 6-D state
  variance_a: 1.0            # signal variance s_ker^2 of k_a
  variance_b: 1.0            # signal variance s_ker^2 of k_b
  noise_variance: 0.01       # working likelihood Sigma_e = sigma_on^2 I, Eq. (21)
  N_max: 50                  # retained valid observations per axis
  minimum_sample_interval: 0.01  # s, insertion rate up to 100 Hz
  gain_floor: 0.5            # g_on of the protected inverse, Eq. (28)
  max_sensor_skew: 0.02      # s, odometry/IMU stamp alignment
  input_delay: 0.0           # s, command-to-response delay
  command_max_age: 0.03      # s, oldest executed command paired with a label

rtmpc:
  dt: 0.01                   # s, sampling period T_s
  H: 20                      # horizon
  # Base set Z0 of the homothetic tube, Eq. (47): finite sum of s terms of
  # A_K^j W0 with A_K^s W0 <= alpha W0.
  tube_terms: 500            # s
  tube_alpha: 1.0e-4         # alpha
  tube_contraction: 0.999    # lambda in A_K Z0 (+) W0 <= lambda Z0 (Remark 8(i))
  slack_linear_weight: 1000.0      # soft tracking constraints, Eq. (54)
  slack_quadratic_weight: 10000.0
  xy:
    Q_p: 10.0
    Q_v: 1.0
    R: 0.1
    Q_anc_p: 20.0
    Q_anc_v: 2.0
    R_anc: 0.01
    limit_p: 2.0             # m, position-error limit
    limit_v: 2.0             # m/s, velocity-error limit
    limit_u_min: -3.0        # m/s^2, physical net acceleration
    limit_u_max: 3.0
    correction_min: -3.0     # m/s^2, correction-input set V
    correction_max: 3.0
  z:
    Q_p: 15.0
    Q_v: 2.0
    R: 0.5
    Q_anc_p: 30.0
    Q_anc_v: 5.0
    R_anc: 0.01
    limit_p: 1.5
    limit_v: 1.0
    limit_u_min: -2.0
    limit_u_max: 5.0
    correction_min: -2.0
    correction_max: 5.0

bounds:
  # Explicit implementation design inputs for the paper's assumptions.
  # They are not experiment results or measured certificates. The controller
  # checks invariance/feasibility with these values and rejects incompatible
  # budgets instead of clipping them to force a feasible controller.
  # Analysis domain X (Assumption 1) and hard safety limits (Remark 8),
  # [px, py, pz, vx, vy, vz]: 10 x 10 m arena.
  state_lower: [-5.0, -5.0, -0.5, -3.0, -3.0, -2.0]
  state_upper: [ 5.0,  5.0,  3.5,  3.0,  3.0,  2.0]
  # Residual budget of Assumption 4, Theorem 2 and Eq. (46), m/s^2 unless noted.
  #   rkhs_norm: RKHS norm bound B of the task errors a, b (Eq. 39)
  #   disturbance d, measurement eps, state_error e_x (m, m/s), synchronization,
  #   command_modification c, hold_error (hold and reference discretization),
  #   lipschitz_f/g (1/s), reference_acceleration: allowed reference acceleration,
  #   min/max_envelope: admissible scaling of the homothetic tube (Eq. 47).
  # state_error also bounds each component of the state-information box;
  # tube propagation accounts for every subsequent consistent estimator update.
  x:
    rkhs_norm: 0.36
    disturbance: 0.25
    measurement: 0.10
    state_error: 0.03
    synchronization: 0.02
    command_modification: 0.10
    hold_error: 0.05
    lipschitz_f: 0.8
    lipschitz_g: 0.1
    reference_acceleration: 1.5
    min_envelope: 0.5
    max_envelope: 1.20
  y:
    rkhs_norm: 0.36
    disturbance: 0.25
    measurement: 0.10
    state_error: 0.03
    synchronization: 0.02
    command_modification: 0.10
    hold_error: 0.05
    lipschitz_f: 0.8
    lipschitz_g: 0.1
    reference_acceleration: 1.5
    min_envelope: 0.5
    max_envelope: 1.20
  z:
    rkhs_norm: 0.30
    disturbance: 0.20
    measurement: 0.08
    state_error: 0.03
    synchronization: 0.02
    command_modification: 0.08
    hold_error: 0.04
    lipschitz_f: 0.8
    lipschitz_g: 0.1
    reference_acceleration: 0.5
    min_envelope: 0.4
    max_envelope: 0.95
